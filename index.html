<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi año en foco · Tenkai Consulting</title>
<meta name="description" content="Tu rueda del año, tu foco y una ruta con paradas para el 2027. En 15 minutos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ TENKAI · MI AÑO EN FOCO · v3 ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --i:#3b35a8;--deep:#2d2894;--mag:#8b3a8f;--coral:#d4522a;
  --bg:#f0eff5;--ink:#1a1a2e;--sub:#555566;--muted:#888899;--border:#e2e0ea;
  --grad:linear-gradient(135deg,#3b35a8 0%,#8b3a8f 50%,#d4522a 100%);
  --grad-h:linear-gradient(90deg,#3b35a8 0%,#d4522a 100%);
  --f:'Figtree',system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--f);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
a{color:inherit}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes tilt{0%,100%{transform:rotateY(-28deg) rotateX(16deg)}50%{transform:rotateY(28deg) rotateX(-8deg)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---- Header (blanco, logo de color) + barra mínima de avance ---- */
.hdr{position:sticky;top:0;z-index:50;background:#fff}
.hdr-in{max-width:780px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:12px}
.hdr img{width:42px;height:42px;border-radius:9px;display:block}
.brand{font-weight:900;font-size:19px;letter-spacing:.14em;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.hbar{height:3px;background:var(--border)}
.hbar i{display:block;height:100%;width:0;background:var(--i);transition:width .45s ease}

.wrap{max-width:780px;margin:0 auto;padding:0 24px}
.screen{padding:30px 0 40px;animation:rise .4s ease both}

/* ---- Tipografía ---- */
.eb{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.q{font-size:clamp(28px,6.2vw,44px);font-weight:900;letter-spacing:-1px;line-height:1.05;margin-top:10px}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lead{font-size:15.5px;color:var(--sub);line-height:1.65;margin-top:12px;max-width:58ch}
.blk{margin-top:30px}
.blk h3{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
.blk .hint{font-size:13px;color:var(--muted);margin-bottom:12px}

/* ---- Chips y opciones ---- */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:10px 17px;border-radius:26px;border:1.5px solid var(--border);background:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:all .15s;line-height:1.3}
.chip:hover{border-color:#b9b7cc}
.chip.on{background:var(--i);border-color:var(--i);color:#fff}
.addc{display:inline-flex;gap:6px;align-items:center}
.addc input{width:150px;border:1.5px dashed #c9c7da;border-radius:26px;padding:9px 14px;font-size:14px;background:transparent;outline:none}
.addc input:focus{border-color:var(--i);border-style:solid;background:#fff}
.addc button{border:0;background:none;color:var(--i);font-weight:800;font-size:13px;cursor:pointer;padding:6px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:15px 16px;font-weight:600;font-size:15px;cursor:pointer;transition:all .15s;line-height:1.4}
.opt:hover{border-color:#b9b7cc}
.opt i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #c9c7da;margin-top:1px;transition:all .15s}
.opt.on{border-color:var(--c,var(--i));background:#fbfbfe}
.opt.on i{border-color:var(--c,var(--i));background:radial-gradient(circle,var(--c,var(--i)) 42%,transparent 48%)}
.own{width:100%;margin-top:10px;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;outline:none;line-height:1.5}
.own:focus,.fld input:focus{border-color:var(--i);box-shadow:0 0 0 3px rgba(59,53,168,.12)}
.fld{margin-top:16px}
.fld label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;margin-bottom:6px}
.fld input{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.row2{grid-template-columns:1fr}}

/* ---- Botones ---- */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 32px;background:var(--grad-h);color:#fff;border:0;border-radius:28px;font-weight:700;font-size:14.5px;letter-spacing:.03em;cursor:pointer;box-shadow:0 4px 18px rgba(59,53,168,.28);transition:transform .15s,box-shadow .15s;text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(59,53,168,.34)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.ghost{background:#fff;color:var(--i);border:1.5px solid var(--border);box-shadow:none}
.btn.ghost:hover{border-color:var(--i)}
.btn.white{background:#fff;color:var(--i);box-shadow:0 4px 18px rgba(0,0,0,.18)}
.btn.sm{padding:10px 20px;font-size:13px}
.btn.full{width:100%}
.link{background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;padding:8px}
.err{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;background:#fdeee9;color:#9a3412;font-size:13px;font-weight:600}
.err.on{display:block}

/* ---- Rueda ---- */
.rwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:22px}
@media(max-width:700px){.rwrap{grid-template-columns:1fr}}
.wheelcard{background:#fff;border:1px solid var(--border);border-radius:18px;padding:10px;box-shadow:0 2px 10px rgba(59,53,168,.07);position:sticky;top:78px}
@media(max-width:700px){.wheelcard{position:static}}
.wheelcard svg{display:block;width:100%;height:auto}
.srow{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:13px 16px 14px;margin-bottom:10px;transition:border-color .15s}
.srow.foc{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent)}
.srow-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.srow-h b{font-size:14.5px;font-weight:800;color:var(--c)}
.srow-h span.v{font-size:22px;font-weight:900;color:var(--c);min-width:30px;text-align:right}
.srow-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;min-height:30px}
.srow small{font-size:12px;color:var(--muted)}
.tg{border:1.5px solid var(--border);background:#fff;border-radius:20px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;color:var(--sub);white-space:nowrap;transition:all .15s}
.tg:hover{border-color:var(--c);color:var(--c)}
.srow.foc .tg{background:var(--c);border-color:var(--c);color:#fff}
.fcount{margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
input[type=range].rg{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--c) var(--p),#e2e0ea var(--p));outline:none;cursor:pointer}
.rg::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--c);box-shadow:0 2px 8px rgba(0,0,0,.22)}
.rg::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--c);box-shadow:0 2px 8px rgba(0,0,0,.22)}

/* ---- Objetivo (una pantalla por foco) ---- */
.atag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:24px;background:var(--c);color:#fff;font-size:13px;font-weight:800;margin-top:12px}
.atag span{opacity:.8;font-weight:600}

/* ---- Agenda ---- */
.pauta{margin-top:20px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;font-size:14px;color:var(--sub)}
.pauta b{color:var(--ink)}
.pauta ol{margin:8px 0 0 20px}
.agenda{margin-top:22px;background:#fff;border:1.5px solid var(--i);border-radius:18px;padding:22px 22px 20px;box-shadow:0 4px 20px rgba(59,53,168,.12)}
.agenda h3{font-size:19px;font-weight:900;letter-spacing:-.3px}
.agenda p{font-size:14px;color:var(--sub);margin-top:5px;max-width:60ch}
.agenda .bt{display:grid;gap:10px;margin-top:16px}
.agenda .alt{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:13px;color:var(--sub)}

/* ---- Ruta (mapa con paradas) ---- */
.route{margin-top:26px}
.stop{display:grid;grid-template-columns:84px 1fr;position:relative;animation:rise .5s ease both;animation-delay:calc(var(--n)*.12s)}
.rd{position:relative}
.rd svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rd .road{fill:none;stroke:#dcd9ec;stroke-width:12;stroke-linecap:round;vector-effect:non-scaling-stroke}
.rd .dash{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:6 8;vector-effect:non-scaling-stroke}
.node{position:absolute;top:calc(14% - 18px);width:36px;height:36px;border-radius:50%;background:var(--nc);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 3px 10px rgba(59,53,168,.3)}
.sc{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin:0 0 18px;box-shadow:0 2px 10px rgba(59,53,168,.07)}
.sc .d{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--nc)}
.sc h4{font-size:18px;font-weight:800;letter-spacing:-.2px;margin-top:2px}
.sc .qq{font-size:13.5px;color:var(--sub);margin-top:4px}
.sc ul{list-style:none;margin-top:10px}
.sc li{font-size:13.5px;line-height:1.45;padding:7px 0 7px 14px;border-top:1px solid var(--border);position:relative}
.sc li::before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:50%;background:var(--c)}
.sc li em{display:block;font-style:normal;color:var(--muted);font-size:12.5px}

/* ---- Placa degradé (portada y cierre) ---- */
.plate{background:var(--grad);color:#fff;position:relative}
.hero{padding:44px 0 36px}
.hgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center}
@media(max-width:700px){.hgrid{grid-template-columns:1fr}.hviz{max-width:300px;margin:0 auto}}
.hero .eb{color:rgba(255,255,255,.72)}
.hero h1{font-size:clamp(40px,8.5vw,64px);font-weight:900;letter-spacing:-1.4px;line-height:1;margin-top:14px}
.hero h1 span{opacity:.72}
.hero p.lead{color:rgba(255,255,255,.9);font-size:16.5px}
.pts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.pt{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);border-radius:24px;padding:8px 16px;font-size:13.5px;font-weight:700}
.hero .go{margin-top:28px}
.hviz{perspective:900px;animation:drift 7s ease-in-out infinite}
.hviz svg{width:100%;height:auto;display:block;transform-style:preserve-3d;animation:tilt 14s ease-in-out infinite;filter:drop-shadow(0 18px 24px rgba(20,10,80,.28))}
.foot{padding:34px 0 28px;text-align:center}
.plate .foot{border-top:1px solid rgba(255,255,255,.2)}
.foot img{height:46px;width:auto;display:block;margin:0 auto 20px}
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px}
.flinks a{display:inline-flex;align-items:center;gap:7px;color:#fff;text-decoration:none;font-size:13px;font-weight:300;letter-spacing:.02em;opacity:.9}
.flinks a:hover{opacity:1;text-decoration:underline}
.flinks svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.copy{margin-top:22px;font-size:11px;font-weight:600;letter-spacing:.2em;color:rgba(255,255,255,.75)}

/* ---- Final ---- */
.done{padding:34px 0 30px}
.done h2{font-size:clamp(28px,6vw,40px);font-weight:900;letter-spacing:-.8px;line-height:1.05;margin-top:10px}
.done p{margin-top:12px;font-size:15.5px;color:rgba(255,255,255,.92);max-width:56ch}
.done .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.sumcard{margin-top:22px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 2px 10px rgba(59,53,168,.07)}
.sumcard .wv{max-width:400px;margin:0 auto}
.sumcard .wv svg{display:block;width:100%;height:auto}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.sum span{background:#f4f3f9;border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--sub)}
.sum b{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--i);margin-right:6px}
.po{border-left:4px solid var(--c);padding-left:14px;margin-top:18px}
.po h4{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.po b.o{display:block;font-size:16px;font-weight:800;margin-top:2px}
.po dl{display:grid;grid-template-columns:104px 1fr;gap:3px 12px;margin-top:6px;font-size:13px}
.po dt{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.po dd{color:var(--sub)}
.closing{padding:54px 0 40px;text-align:left}
.closing h2{font-size:clamp(30px,6.5vw,48px);font-weight:900;letter-spacing:-1px;line-height:1.04}
.closing p{margin-top:16px;font-size:16.5px;line-height:1.7;color:rgba(255,255,255,.93);max-width:54ch}
.closing .sign{margin-top:22px;font-size:15px;color:rgba(255,255,255,.85)}
.closing .sign b{display:block;font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-top:2px;color:#fff}
.closing .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn.line{background:transparent;border:1.5px solid rgba(255,255,255,.55);color:#fff;box-shadow:none}
.btn.line:hover{border-color:#fff}
.soft{margin:18px 0 6px;font-size:14.5px;line-height:1.6;color:var(--sub)}
.soft a{color:var(--i);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.cross{margin:6px 0 34px;background:var(--grad);color:#fff;border-radius:20px;padding:30px 30px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.cross h3{font-size:clamp(22px,4.6vw,30px);font-weight:900;letter-spacing:-.6px;line-height:1.1}
.cross p{margin-top:8px;font-size:15.5px;line-height:1.55;color:rgba(255,255,255,.92);max-width:44ch}
.cross .btn{background:#fff;color:var(--i);flex:none;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.restart{text-align:center;margin:18px 0 26px}
</style>
</head>

<header class="hdr">
  <div class="hdr-in">
    <img id="hdr-logo" alt="Tenkai" width="42" height="42">
    <div><div class="brand">TENKAI</div><div class="brand-sub">Consulting</div></div>
  </div>
  <div class="hbar"><i id="hb"></i></div>
</header>

<main id="app"></main>

/* ---------- Calendario: Google en un clic + archivo para Apple u Outlook ---------- */
function calDef(){
  var m=firstDow(0),q=lastDow(2),c=DCODE[S.ritmo.dow];
  return {
    mensual:{inicio:iso(m),hora:S.ritmo.hora,min:20,rrule:'FREQ=MONTHLY;BYDAY=1'+c+';COUNT=12',titulo:'Mi año en foco · Revisión mensual'},
    trimestral:{inicio:iso(q),hora:S.ritmo.hora,min:60,rrule:'FREQ=MONTHLY;INTERVAL=3;BYDAY=-1'+c+';COUNT=4',titulo:'Mi año en foco · Revisión trimestral'}
  };
}
function addMin(hhmm,min){var p=hhmm.split(':'),t=+p[0]*60+ +p[1]+min;return pad(Math.floor(t/60)%24)+pad(t%60)+'00';}
function gcalURL(ev){
  var d=ev.inicio.replace(/-/g,''),t=ev.hora.replace(':','')+'00';
  var det='Pauta de la revisión:\n'+pauta().map(function(q,i){return (i+1)+'. '+q;}).join('\n');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(ev.titulo)+
    '&dates='+d+'T'+t+'/'+d+'T'+addMin(ev.hora,ev.min)+'&details='+encodeURIComponent(det)+'&recur='+encodeURIComponent('RRULE:'+ev.rrule);
}
function icsEsc(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function fold(l){var o='';while(l.length>72){o+=l.slice(0,72)+'\r\n ';l=l.slice(72);}return o+l;}
function buildICS(){
  var cd=calDef(),n=new Date();
  var stamp=n.getUTCFullYear()+pad(n.getUTCMonth()+1)+pad(n.getUTCDate())+'T'+pad(n.getUTCHours())+pad(n.getUTCMinutes())+pad(n.getUTCSeconds())+'Z';
  var desc='Pauta de la revisión:\n'+pauta().map(function(q,i){return (i+1)+'. '+q;}).join('\n');
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tenkai Consulting//Mi anio en foco//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  ['mensual','trimestral'].forEach(function(k){var e=cd[k],d=e.inicio.replace(/-/g,'');
    L.push('BEGIN:VEVENT','UID:mianioenfoco-'+YEAR+'-'+k+'-'+stamp+'@tenkai.com.ar','DTSTAMP:'+stamp,
      'DTSTART:'+d+'T'+e.hora.replace(':','')+'00','DTEND:'+d+'T'+addMin(e.hora,e.min),'RRULE:'+e.rrule,
      'SUMMARY:'+icsEsc(e.titulo),'DESCRIPTION:'+icsEsc(desc),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.titulo),'TRIGGER:-PT15M','END:VALARM','END:VEVENT');});
  L.push('END:VCALENDAR');return L.map(fold).join('\r\n');
}
function downloadICS(){
  var b=new Blob([buildICS()],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='mi-anio-en-foco-'+YEAR+'.ics';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ---------- La rueda (SVG) ---------- */
function wheelSVG(o){
  o=o||{};var cx=220,cy=205,R=118,n=6,ff=o.font||"Figtree,Arial,sans-serif",g='';
  function ang(i){return -Math.PI/2+i*2*Math.PI/n;}
  function pt(i,v,r){r=(r||R)*v/10;return [cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];}
  function poly(vals){return vals.map(function(v,i){var p=pt(i,v);return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');}
  var ones=function(v){return AREAS.map(function(){return v;});};
  [2,4,6,8,10].forEach(function(l){g+='<polygon points="'+poly(ones(l))+'" fill="'+(l===10?'#faf9fd':'none')+'" stroke="#dcd9ec" stroke-width="'+(l===10?1.5:1)+'"/>';});
  AREAS.forEach(function(a,i){var p=pt(i,10);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#dcd9ec" stroke-width="1"/>';});
  var H=AREAS.map(function(a){return S.hoy[a.id];}),M=AREAS.map(function(a){return S.meta[a.id];});
  if(o.meta)g+='<polygon points="'+poly(M)+'" fill="#d4522a" fill-opacity=".10" stroke="#d4522a" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round"/>';
  g+='<polygon points="'+poly(H)+'" fill="#3b35a8" fill-opacity=".22" stroke="#3b35a8" stroke-width="3" stroke-linejoin="round"/>';
  AREAS.forEach(function(a,i){var p=pt(i,H[i]);g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="5.5" fill="'+a.c+'" stroke="#fff" stroke-width="2"/>';
    if(o.meta){var q=pt(i,M[i]);g+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="4.5" fill="#fff" stroke="#d4522a" stroke-width="2.5"/>';}});
  AREAS.forEach(function(a,i){var c=Math.cos(ang(i)),s=Math.sin(ang(i)),x=cx+(R+26)*c,y=cy+(R+26)*s;
    var an=c>0.3?'start':(c<-0.3?'end':'middle');if(an==='start')x+=4;if(an==='end')x-=4;
    var val=o.meta?(H[i]+' → '+M[i]):String(H[i]);
    g+='<text x="'+x.toFixed(1)+'" y="'+(y-2).toFixed(1)+'" text-anchor="'+an+'" font-family="'+ff+'" font-size="14" font-weight="800" fill="'+a.c+'">'+a.s+'</text>'+
       '<text x="'+x.toFixed(1)+'" y="'+(y+15).toFixed(1)+'" text-anchor="'+an+'" font-family="'+ff+'" font-size="12.5" font-weight="700" fill="#555566">'+val+'</text>';});
  var leg='<g font-family="'+ff+'" font-size="12.5" font-weight="700" fill="#555566"><rect x="'+(o.meta?118:170)+'" y="438" width="22" height="9" rx="4" fill="#3b35a8" fill-opacity=".35" stroke="#3b35a8" stroke-width="2"/><text x="'+(o.meta?146:198)+'" y="447">Hoy</text>'+
    (o.meta?'<rect x="236" y="438" width="22" height="9" rx="4" fill="none" stroke="#d4522a" stroke-width="2" stroke-dasharray="4 3"/><text x="264" y="447">Meta '+YEAR+'</text>':'')+'</g>';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 462" role="img" aria-label="Rueda del año">'+g+leg+'</svg>';
}
function wheelPNG(cb){
  var fin=false;function done(v){if(fin)return;fin=true;cb(v);}
  setTimeout(function(){done('');},3000);          // si el navegador no logra generar la imagen, se envía igual (con barras en el mail)
  try{
    var svg=wheelSVG({meta:true,font:'Arial,Helvetica,sans-serif'});
    var img=new Image();
    img.onload=function(){try{var c=document.createElement('canvas');c.width=880;c.height=924;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);done(c.toDataURL('image/png'));}catch(e){done('');}};
    img.onerror=function(){done('');};
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  }catch(e){done('');}
}

/* ---------- Radar animado de la portada (gira en 3D, las formas se transforman) ---------- */
function heroViz(){
  var cx=220,cy=215,R=150,red=reduceMotion();
  function P(i,v){var a=-Math.PI/2+i*Math.PI/3;return [cx+R*v/10*Math.cos(a),cy+R*v/10*Math.sin(a)];}
  function pl(vs){return vs.map(function(v,i){var q=P(i,v);return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ');}
  function morph(shapes,dur){if(red)return '';var s=shapes.concat([shapes[0]]);
    return '<animate attributeName="points" dur="'+dur+'s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.33;.66;1" keySplines=".45 0 .2 1;.45 0 .2 1;.45 0 .2 1" values="'+s.map(pl).join(';')+'"/>';}
  function spin(from,to,dur){return red?'':'<animateTransform attributeName="transform" type="rotate" from="'+from+' '+cx+' '+cy+'" to="'+to+' '+cx+' '+cy+'" dur="'+dur+'s" repeatCount="indefinite"/>';}
  var A=[[5,6.5,3.5,6,7,4],[8,4,7,3.5,5,7.5],[4,8,5.5,7,3.5,6.5]];
  var B=[[9,8,9.5,7.5,9,8.5],[8,9.5,7,9,9.5,8],[9.5,7.5,8.5,9.5,8,9]];
  var g='<defs><radialGradient id="gl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="205" fill="url(#gl)"/>';
  g+='<g>'+spin(0,360,70);
  [3,5.5,8,10].forEach(function(l){g+='<polygon points="'+pl([l,l,l,l,l,l])+'" fill="none" stroke="#ffffff" stroke-opacity=".30" stroke-width="1.5"/>';});
  for(var i=0;i<6;i++){var q=P(i,10);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="#ffffff" stroke-opacity=".22"/>';}
  g+='</g><g>'+spin(360,0,46)+'<polygon points="'+pl(B[0])+'" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".8" stroke-width="2.5" stroke-dasharray="7 6" stroke-linejoin="round">'+morph(B,11)+'</polygon></g>'+
     '<g>'+spin(0,-360,90)+'<polygon points="'+pl(A[0])+'" fill="#ffffff" fill-opacity=".30" stroke="#fff" stroke-width="3.5" stroke-linejoin="round">'+morph(A,8)+'</polygon></g>';
  return '<svg viewBox="0 0 440 440" aria-hidden="true">'+g+'</svg>';
}

    rowsO.forEach(function(r){font(6.6,true,MUT,0.35);doc.text(r[0].toUpperCase(),M+6,yy+asc(9.5)-.2);doc.setCharSpace(0);yy+=para(r[1],M+6+34,yy,CW-6-34,9.5,false,SUB)+1.6;});
    y+=hh+9;});
  /* pauta */
  var pq=pauta();fill('#f4f3f9');doc.roundedRect(M,y,CW,30,2.5,2.5,'F');
  font(7,true,IND,0.56);doc.text('EN CADA REVISIÓN',M+6,y+7);doc.setCharSpace(0);
  pq.forEach(function(q,i){font(9.5,false,SUB);doc.text((i+1)+'.  '+q,M+6,y+14+i*5.4);});

  /* --- Página 3: la ruta (compacta; si no entra, sigue en otra página) --- */
  page(false);y=34;y=label('Mi ruta '+YEAR,y);
  var st=stops(),cx0=M+9,cx1=M+21,CX=M+33,CWD=W-M-CX,cards=[];
  function lq(sz){return sz*0.3528*1.2;}
  st.forEach(function(s){
    var qL=wrapT(s.q,CWD-8,8.4,false);
    var items=o.map(function(ob){var r=s.f(ob);return {b:r.b,c:area(ob.area).c,la:wrapT(r.a,CWD-12,8.2,true),lb:wrapT(r.b,CWD-12,7.2,false)};});
    var com=(items.length>1&&items.every(function(it){return it.b===items[0].b;}))?items[0].b:'',comL=[];   // si la nota es igual para todos los objetivos, se muestra una sola vez
    if(com){items.forEach(function(it){it.lb=[];});comL=wrapT(com,CWD-8,7.6,false);}
    var hh=3+lq(6.6)+.8+lq(11)+qL.length*lq(8.4)+1.6+(comL.length?comL.length*lq(7.6)+1.2:0);
    items.forEach(function(it){hh+=it.la.length*lq(8.2)+it.lb.length*lq(7.2)+1;});
    hh+=2;cards.push({s:s,qL:qL,comL:comL,items:items,h:hh});});
  var limit=H-20,groups=[[]],acc=y;
  cards.forEach(function(cd){if(acc+cd.h>limit&&groups[groups.length-1].length){groups.push([]);acc=34;}groups[groups.length-1].push(cd);acc+=cd.h+3;});
  var gi0=0;
  groups.forEach(function(grp,gi){
    if(gi>0){page(false);y=34;}
    var tot=0;grp.forEach(function(cd){tot+=cd.h;});
    var gap=grp.length>1?Math.max(2,Math.min(7,(limit-y-tot)/(grp.length-1))):0;
    var tops=[],yy=y;grp.forEach(function(cd){tops.push(yy);yy+=cd.h+gap;});
    var nodes=tops.map(function(t,i){return [(gi0+i)%2?cx1:cx0,t+8];});
    function road(){for(var k=0;k<nodes.length-1;k++){var a0=nodes[k],b0=nodes[k+1],dy=b0[1]-a0[1];doc.lines([[0,dy*.5,b0[0]-a0[0],dy*.5,b0[0]-a0[0],dy]],a0[0],a0[1],[1,1],'S',false);}}
    doc.setLineCap('round');strk('#dcd9ec');doc.setLineWidth(3.4);road();
    strk('#ffffff');doc.setLineWidth(.45);doc.setLineDashPattern([1.4,2.2],0);road();doc.setLineDashPattern([],0);
    grp.forEach(function(cd,i){var t=tops[i],s=cd.s,gidx=gi0+i;
      fill('#ffffff');strk(BOR);doc.setLineWidth(.25);doc.roundedRect(CX,t,CWD,cd.h,2.6,2.6,'FD');
      var ty=t+3;font(6.6,true,s.nc,0.35);doc.text((s.t+'  ·  '+fechaLarga(s.d)).toUpperCase(),CX+4,ty+asc(6.6));doc.setCharSpace(0);ty+=lq(6.6)+.8;
      font(11,true,INK);doc.text(s.tit,CX+4,ty+asc(11));ty+=lq(11);
      font(8.4,false,SUB);cd.qL.forEach(function(l,j){doc.text(l,CX+4,ty+asc(8.4)+j*lq(8.4));});ty+=cd.qL.length*lq(8.4);
      if(cd.comL.length){font(7.6,false,MUT);cd.comL.forEach(function(l,j){doc.text(l,CX+4,ty+asc(7.6)+j*lq(7.6));});ty+=cd.comL.length*lq(7.6)+1.2;}
      ty+=1.6;
      cd.items.forEach(function(it){strk(BOR);doc.setLineWidth(.2);doc.line(CX+4,ty-.7,CX+CWD-4,ty-.7);
        fill(it.c);doc.circle(CX+5.4,ty+asc(8.2)-.7,.9,'F');
        font(8.2,true,INK);it.la.forEach(function(l,j){doc.text(l,CX+8.6,ty+asc(8.2)+j*lq(8.2));});ty+=it.la.length*lq(8.2);
        font(7.2,false,MUT);it.lb.forEach(function(l,j){doc.text(l,CX+8.6,ty+asc(7.2)+j*lq(7.2));});ty+=it.lb.length*lq(7.2)+1;});
      var nx=nodes[i][0],ny=nodes[i][1];fill(s.nc);strk('#ffffff');doc.setLineWidth(.9);doc.circle(nx,ny,4.6,'FD');
      if(gidx===0){fill('#ffffff');var sp=[];for(var q2=0;q2<10;q2++){var r2=q2%2?1.5:3.1,an=-Math.PI/2+q2*Math.PI/5;sp.push([nx+r2*Math.cos(an),ny+.2+r2*Math.sin(an)]);}poly(sp,'F');}
      else if(gidx===cards.length-1){strk('#ffffff');doc.setLineWidth(.95);doc.line(nx-2.2,ny+.2,nx-.6,ny+1.9);doc.line(nx-.6,ny+1.9,nx+2.4,ny-1.8);}
      else{font(10,true,'#ffffff');doc.text(String(gidx),nx,ny+1.4,{align:'center'});}
    });
    doc.setLineCap('butt');gi0+=grp.length;
  });

  /* --- Página 4: revisiones, seguimiento y notas --- */
  page(false);y=34;y=label('Mis revisiones',y);
  var dn=DOWN[S.ritmo.dow];
  font(6.8,true,IND,0.42);doc.text('MENSUAL',M,y+asc(9.5));doc.setCharSpace(0);y+=para('Primer '+dn+' de cada mes, '+S.ritmo.hora+' h  ·  20 minutos',M+30,y,CW-30,9.5,false,SUB)+2;
  font(6.8,true,IND,0.42);doc.text('TRIMESTRAL',M,y+asc(9.5));doc.setCharSpace(0);y+=para('Último '+dn+' de marzo, junio, septiembre y diciembre  ·  60 minutos',M+30,y,CW-30,9.5,false,SUB)+4;
  fill('#f4f3f9');doc.roundedRect(M,y,CW,24,2.5,2.5,'F');
  font(7,true,IND,0.56);doc.text('EN CADA REVISIÓN',M+6,y+6.4);doc.setCharSpace(0);
  pq.forEach(function(q,i){font(9,false,SUB);doc.text((i+1)+'.  '+q,M+6,y+12+i*4.6);});y+=32;
  y=label('Hoja de seguimiento mensual',y);
  var nw=60,cw=(CW-nw)/12,mm='EFMAMJJASOND'.split('');
  font(7,true,MUT);mm.forEach(function(m,i){doc.text(m,M+nw+cw*i+cw/2,y+2,{align:'center'});});y+=5;
  o.forEach(function(ob){var tl=wrapT(ob.obj,nw-4,8.4,true),rh=Math.max(9,tl.length*lh(8.4)+3);
    strk(BOR);doc.setLineWidth(.2);doc.line(M,y,W-M,y);
    font(8.4,true,INK);tl.forEach(function(l,j){doc.text(l,M,y+3.6+j*lh(8.4));});
    strk('#b9b7cc');doc.setLineWidth(.35);for(var m=0;m<12;m++){doc.roundedRect(M+nw+cw*m+cw/2-1.8,y+rh/2-1.8,3.6,3.6,.6,.6,'S');}
    y+=rh;});
  strk(BOR);doc.setLineWidth(.2);doc.line(M,y,W-M,y);
  font(7.5,false,MUT);doc.text('Marcá cada mes según tu avance. Lo que no se mide, se diluye.',M,y+5);y+=12;
  y=label('Notas de mis revisiones',y);
  strk(BOR);doc.setLineWidth(.2);for(var ln=y+7;ln<H-60;ln+=9){doc.line(M,ln,W-M,ln);}
  /* venta cruzada: Foco 2027 */
  var by=H-54;fill('#f4f3f9');doc.roundedRect(M,by,CW,33,3,3,'F');
  font(12,true,INK,-0.1);doc.text('Tu plan, con alguien que te acompañe',M+7,by+9.5);
  y2=para('Foco '+YEAR+': ocho encuentros de coaching ejecutivo para trabajar lo que más te importa, con la frecuencia que decidas.',M+7,by+12.5,CW-14,9,false,SUB);
  font(9.5,true,IND);doc.textWithLink('Pedir información del programa Foco '+YEAR,M+7,by+27,{url:focoURL('pdf-mi-anio-en-foco-cierre')});
  return doc;
}
function makePDF(cb){
  loadJsPDF(function(JS){
    if(!JS)return cb(null);
    try{cb(buildPDF(JS));}catch(e){try{console.error(e);}catch(x){}cb(null);}
  });
}
function pdfBase64(doc){try{return String(doc.output('datauristring')).split(',')[1]||'';}catch(e){return '';}}

/* ---------- Render ---------- */
function render(){
  var map={welcome:vWelcome,cierre:vCierre,hoy:function(){return vRueda('hoy');},meta:function(){return vRueda('meta');},obj:vObj,agenda:vAgenda,ruta:vRuta,datos:vDatos,final:vFinal};
  $('#app').innerHTML=map[SCREENS[S.step]]();
  var k=SCREENS[S.step],p=PROG[S.step];$('#hb').style.width=(k==='welcome'?0:k==='final'?100:p/6*100)+'%';
  save();
}
function go(n){S.step=n;render();window.scrollTo({top:0,behavior:'smooth'});}

/* ---------- Avance y validación ---------- */
function next(){
  var k=SCREENS[S.step];
  if(k==='meta'){
    if(S.foco.length<2||S.foco.length>3)return showErr('Marcá 2 o 3 áreas en las que quieras enfocarte.');
    S.oi=0;
  }
  if(k==='obj'){
    var id=S.foco[S.oi],o=S.objs[id]||{};
    if(!(o.obj||'').trim())return showErr('Elegí tu objetivo, o escribí el tuyo.');
    if(!(o.ind||'').trim())return showErr('Elegí cómo vas a medirlo, o escribí tu indicador.');
    if(!(o.paso||'').trim())return showErr('Elegí tu primer paso, o escribí el tuyo.');
    if(!o.why)return showErr('Elegí para qué lo hacés.');
    if(S.oi<S.foco.length-1){S.oi++;render();window.scrollTo({top:0,behavior:'smooth'});return;}
  }
  go(S.step+1);
}
function back(){
  if(SCREENS[S.step]==='obj'&&S.oi>0){S.oi--;render();window.scrollTo({top:0,behavior:'smooth'});return;}
  if(SCREENS[S.step]==='agenda'){S.oi=Math.max(0,S.foco.length-1);}
  go(S.step-1);
}
function send(){
  var d=S.datos;if(d.web)return;
  if(d.nombre.trim().length<2)return showErr('Escribí tu nombre.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email.trim()))return showErr('Revisá tu mail: parece incompleto.');
  if(!ENDPOINT){S.local=true;S.sent=false;return go(ST.final);}
  var b=$('[data-act="send"]');b.disabled=true;b.textContent='Armando tu plan…';
  var cd=calDef(),st=stops();
  wheelPNG(function(png){
    makePDF(function(doc){
      var payload={nombre:d.nombre.trim(),email:d.email.trim(),web:'',anio:YEAR,cierre:S.cierre,hoy:S.hoy,meta:S.meta,
        foco:objList().map(function(o){return {area:o.area,areaNombre:area(o.area).n,obj:o.obj,ind:o.ind,paso:o.paso,why:o.why,obst:o.obst};}),
        ritmo:{dia:DOWN[S.ritmo.dow],hora:S.ritmo.hora},
        cal:{mensual:cd.mensual,trimestral:cd.trimestral,gcalM:gcalURL(cd.mensual),gcalT:gcalURL(cd.trimestral)},
        ruta:st.map(function(s){return {t:s.t,fecha:fechaLarga(s.d),lab:s.lab,tit:s.tit,q:s.q,
          lineas:objList().map(function(o){var r=s.f(o);return r.a+' — '+r.b;})};}),
        rueda:png,pdf:doc?pdfBase64(doc):'',origen:location.href};
      fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
        .then(function(){S.sent=true;S.sentTo=payload.email;go(ST.final);})
        .catch(function(){b.disabled=false;b.textContent='Armar y enviar mi plan';showErr('No pudimos enviar el mail. Revisá tu conexión e intentá de nuevo.');});
    });
  });
}

/* ---------- Eventos ---------- */
var app=$('#app');
function toggleIn(k,v){var g=CIERRE[k],a=S.cierre[k],p=a.indexOf(v);
  if(g.max===1){S.cierre[k]=p>-1?[]:[v];return;}
  if(p>-1)a.splice(p,1);else{if(a.length>=g.max)a.shift();a.push(v);}}
app.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),v=el.getAttribute('data-v'),id=el.getAttribute('data-id');
  if(act==='start')go(S.step>0&&S.step<ST.final?S.step:1);
  else if(act==='next')next();
  else if(act==='back')back();
  else if(act==='send')send();
  else if(act==='chip'){toggleIn(el.getAttribute('data-k'),v);render();}
  else if(act==='addchip'){var k=el.getAttribute('data-k'),inp=$('[data-add="'+k+'"]'),t=inp.value.trim();if(t){var g=CIERRE[k];if(g.o.indexOf(t)<0&&S.cierre[k].indexOf(t)<0){S.cierre[k].push(t);if(S.cierre[k].length>g.max)S.cierre[k].shift();}render();}}
  else if(act==='focotg'){ // foco integrado en la pantalla de la meta (sin re-render para no perder el estado de las barras)
    var p=S.foco.indexOf(id);
    if(p>-1)S.foco.splice(p,1);else{if(S.foco.length>=3){showErr('Elegí hasta 3 áreas. Sacá una para sumar otra.');return;}S.foco.push(id);}
    var row=$('#row-'+id),on=S.foco.indexOf(id)>-1;row.classList.toggle('foc',on);el.textContent=on?'En foco ✓':'Enfocarme acá';
    $('#fcount').textContent=fcountTxt();var er=$('#err');if(er)er.className='err';save();}
  else if(act==='pick'){
    var gname=el.getAttribute('data-g'),i=+el.getAttribute('data-i'),fid=S.foco[S.oi],a=area(fid),o=S.objs[fid];
    if(gname==='obj'){o.sel=i;o.obj=i>=0?a.objs[i].t:'';o.indSel=undefined;o.ind='';o.pasoSel=undefined;o.paso='';if(i===-1){o.indSel=-1;o.pasoSel=-1;}}
    else{var ob=o.sel>=0?a.objs[o.sel]:null;o[gname+'Sel']=i;o[gname]=(i>=0&&ob)?ob[gname][i]:'';}
    render();
  }
  else if(act==='why'){var oo=S.objs[S.foco[S.oi]];oo.why=oo.why===v?'':v;render();}
  else if(act==='obst'){var o2=S.objs[S.foco[S.oi]];o2.obst=o2.obst===v?'':v;render();}
  else if(act==='dow'){S.ritmo.dow=+v;render();}
  else if(act==='hora'){S.ritmo.hora=v;render();}
  else if(act==='ics')downloadICS();
  else if(act==='pdf'){el.disabled=true;el.textContent='Generando…';makePDF(function(doc){el.disabled=false;el.textContent='Descargar PDF';if(doc)doc.save('mi-anio-en-foco-'+YEAR+'.pdf');else alert('No pudimos generar el PDF. Revisá tu conexión e intentá de nuevo.');});}
  else if(act==='restart'){if(confirm('Se borra lo que cargaste y empezás de cero. ¿Seguimos?')){try{localStorage.removeItem(LS);}catch(e){}S=blank();render();window.scrollTo({top:0});}}
});
app.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.hasAttribute&&ev.target.hasAttribute('data-add')){ev.preventDefault();var b=$('[data-act="addchip"][data-k="'+ev.target.getAttribute('data-add')+'"]');if(b)b.click();}});
app.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.hasAttribute('data-r')){ // sliders: actualización en vivo de la rueda, sin re-render
    var k=el.getAttribute('data-r'),a=el.getAttribute('data-a'),v=+el.value;S[k][a]=v;if(k==='meta')S.metaTouched[a]=true;
    el.style.setProperty('--p',((v-1)/9*100)+'%');$('#v-'+a).textContent=v;$('#h-'+a).textContent=k==='hoy'?HINT[v]:deltaTxt(a);
    $('#wheel').innerHTML=wheelSVG({meta:k==='meta'});save();return;}
  if(el.hasAttribute('data-own')){var o=S.objs[S.foco[S.oi]];if(o)o[el.getAttribute('data-own')]=el.value;save();return;}
  var b=el.getAttribute('data-bind');if(b){S.datos[b]=el.value;save();}
});

$('#hdr-logo').src=LOGO;
if(S.step>=SCREENS.length||S.step<0)S.step=0;
render();
})();
</script>
